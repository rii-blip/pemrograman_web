<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Pendaftaran Mahasiswa</title>
</head>
<body>
    <h1>Website Pendaftaran Mahasiswa</h1>
    <ul>    
        <li><a href="#">Beranda</a></li>
        <li><a href="#">Profil</a></li>
        <li><a href="#">Pendaftaran</a></li>
    </ul>

    <h2>Form Pendaftaran </h2>
    <form>
        <label for="nama">Nama:</label>
        <input type="text" id="nama" name="nama" required><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required><br>

        <label for="tanggal lahir">Tanggal Lahir:</label>
        <input type="date" id="tanggal lahir" name="tanggal lahir" required><br>

        <label for="umur">Umur:</label>
        <input type="number" id="umur" name="umur" required><br>

        <label for="upload">Upload File:</label>
        <input type="file" id="upload" name="upload" required><br>

        <label for="gender">Gender:</label>
        <input type="radio" id="perempuan" name="gender" value="perempuan" required>
        <label for="perempuan">Perempuan</label>
        <input type="radio" id="laki-laki" name="gender" value="laki-laki" required>
        <label for="laki-laki">Laki-laki</label><br>

        <label for="hobi">Hobi:</label>
        <input type="checkbox" id="membaca" name="hobi[]" value="membaca">Membaca
        <input type="checkbox" id="menulis" name="hobi[]" value="menulis">Menulis
        <input type="checkbox" id="olahraga" name="hobi[]" value="olahraga">Olahraga<br>
        
        <label for="alamat">Alamat:</label>
        <textarea id="alamat" name="alamat" rows="5" placeholder="Tulisakan alamat lengkap Anda" required></textarea><br>

        <input type="submit" value="Simpan">

        <p>&copy; 2026 Website Pendaftaran Mahasiswa P8. Fachri Ariffadillah</p>

</body>
</html>
